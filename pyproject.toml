[project]
name = "optimization-for-ai"
version = "0.1.0"
description = "Algorithms for the course Optimization for AI"
readme = "README.md"
authors = [
    { name = "Adnan Memic", email = "adnan.memic27@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.3",
]

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]
